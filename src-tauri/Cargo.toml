[package]
name = "cpudoc"
version = "0.1.0"
description = "Control and monitor your CPU"
edition = "2021"

[lib]
name = "cpudoc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
